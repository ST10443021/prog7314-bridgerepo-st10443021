name: API CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "DevLedger/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "DevLedger/api/**"

jobs:
  build-and-test:
    name: Build & Unit Test (API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: DevLedger/api

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: DevLedger/api

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
        working-directory: DevLedger/api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: DevLedger/api/DevLedger.Api.Tests/TestResults/