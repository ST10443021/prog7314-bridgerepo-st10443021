name: Android CI

# Run both projects on every push, including working branches and documentation changes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: DevLedger/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            DevLedger/android/**/*.gradle*
            DevLedger/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # google-services.json is private and git-ignored. CI uses the real file when the repository
      # secret GOOGLE_SERVICES_JSON_B64 (base64 of the file) exists; otherwise it falls back to the
      # structural placeholder so forks and pull requests still compile. Push delivery is not
      # exercised in CI, so the placeholder is sufficient for build, unit tests and lint.
      - name: Provide Firebase client configuration
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            echo "Using the real Firebase configuration from repository secrets."
          else
            cp app/google-services.json.example app/google-services.json
            echo "::notice::GOOGLE_SERVICES_JSON_B64 not set - using the placeholder google-services.json."
          fi

      - name: Check Firebase client configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/google-services.json")
          if not path.is_file():
              raise SystemExit("Missing app/google-services.json.")
          config = json.loads(path.read_text(encoding="utf-8-sig"))
          clients = config.get("client", [])
          matching = [
              client for client in clients
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.devledger.app"
          ]
          if not matching:
              raise SystemExit("Firebase configuration has no client for com.devledger.app.")
          print("Firebase Android client configuration found for com.devledger.app.")
          PY

      - name: Prepare checked-in Gradle wrapper
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          java -version
          ./gradlew --no-daemon --version

      # assembleRelease also runs R8 shrinking and release lint, so ProGuard problems that only
      # appear in the minified production build are caught on every push (unsigned without a keystore).
      - name: Build, run unit tests and lint
        run: ./gradlew --no-daemon --continue :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Verify outputs and calculate APK checksum
        run: |
          test -s app/build/reports/tests/testDebugUnitTest/index.html
          test -s app/build/reports/lint-results-debug.html
          test -s app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-results
          path: |
            DevLedger/android/app/build/reports/tests/testDebugUnitTest/
            DevLedger/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: DevLedger/android/app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK and checksum
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: devledger-debug-apk
          path: |
            DevLedger/android/app/build/outputs/apk/debug/app-debug.apk
            DevLedger/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
