name: API CI

# Builds and runs the xUnit test suite for the DevLedger REST API on every push,
# mirroring the Android workflow's "build + test on every push" requirement for the
# backend half of the project.
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "api/**"

jobs:
  build-and-test:
    name: Build & Unit Test (API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore
        working-directory: api

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: api

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
        working-directory: api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/DevLedger.Api.Tests/TestResults/
