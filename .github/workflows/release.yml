name: Signed release

# Builds the signed production APK and Android App Bundle, verifies the signature and publishes a
# GitHub Release. Run it by pushing the final tag:
#   git tag -a Final-POE -m "Final PoE submission" && git push origin Final-POE
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, GOOGLE_SERVICES_JSON_B64
# See README.md ("Release and signing"). Reference: (GitHub, n.d.b). See REFERENCES-CODE.md.
on:
  push:
    tags:
      - 'Final-POE'
      - 'final-poe'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    name: Build and sign release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: DevLedger/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            DevLedger/android/**/*.gradle*
            DevLedger/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore secrets (keystore and Firebase configuration)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing."; exit 1; fi
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON_B64 is missing."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/devledger-upload.jks"
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Build signed release APK and bundle
        env:
          DEVLEDGER_KEYSTORE_FILE: ${{ runner.temp }}/devledger-upload.jks
          DEVLEDGER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DEVLEDGER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DEVLEDGER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify the APK signature and write checksums
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" devledger-1.0.0-release.apk
          cp app/build/outputs/bundle/release/app-release.aab devledger-1.0.0-release.aab
          sha256sum devledger-1.0.0-release.apk devledger-1.0.0-release.aab | tee SHA256SUMS.txt

      - name: Upload release artefacts
        uses: actions/upload-artifact@v7
        with:
          name: devledger-signed-release
          path: |
            DevLedger/android/devledger-1.0.0-release.apk
            DevLedger/android/devledger-1.0.0-release.aab
            DevLedger/android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DevLedger ${{ github.ref_name }}
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            DevLedger/android/devledger-1.0.0-release.apk
            DevLedger/android/devledger-1.0.0-release.aab
            DevLedger/android/SHA256SUMS.txt
